
name: Build Android APK from HTML

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Java
        run: |
          java -version
          echo "CORDOVA_JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android Project
        run: |
          cordova create myapp com.shimul.htmlapp HTMLApp

      - name: Install Android Platform
        run: |
          cd myapp
          cordova platform add android@15.0.0

      - name: Copy Original HTML Website
        run: |
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='myapp/' \
            --exclude='config.xml' \
            --exclude='README*' \
            --exclude='LICENSE*' \
            "$GITHUB_WORKSPACE/" myapp/www/

          if [ ! -f myapp/www/index.html ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          echo "Website files copied successfully."
          ls -la myapp/www/

      - name: Build Android APK
        run: |
          cd myapp
          cordova build android --debug

      - name: Verify APK
        run: |
          APK="myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          unzip -l "$APK" | grep 'assets/www/index.html'

          echo "APK verification completed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Android-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
