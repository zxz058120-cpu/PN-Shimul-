
name: Build Android APK from HTML

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Java for Cordova
        run: |
          echo "CORDOVA_JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          java -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.shimul.htmlapp HTMLApp
          cd myapp
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          rm -rf www/.github www/.git
          cordova platform add android@15.0.0

      - name: Check Java and Gradle
        run: |
          cd myapp
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "CORDOVA_JAVA_HOME=$CORDOVA_JAVA_HOME"

      - name: Build APK
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
