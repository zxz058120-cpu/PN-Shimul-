
name: Build VEYLQOR Android APK

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Java
        run: |
          java -version
          echo "CORDOVA_JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create VEYLQOR Android Project
        run: |
          cordova create myapp com.shimul.htmlapp VEYLQOR

      - name: Install Android Platform
        run: |
          cd myapp
          cordova platform add android@15.0.0

      - name: Copy Original HTML Application
        shell: bash
        run: |
          set -e

          mapfile -d '' HTML_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 -type f \
              \( -iname '*.html' -o -iname '*.htm' \) \
              -print0
          )

          if [ "${#HTML_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one main HTML file."
            echo "Found: ${#HTML_FILES[@]}"
            exit 1
          fi

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='myapp/' \
            --exclude='config.xml' \
            --exclude='README*' \
            --exclude='LICENSE*' \
            "$GITHUB_WORKSPACE/" myapp/www/

          cp "${HTML_FILES[0]}" myapp/www/index.html

          echo "Original HTML renamed to index.html"

          test -s myapp/www/index.html

          echo "Application files:"
          find myapp/www -maxdepth 3 -type f

      - name: Build Android APK
        run: |
          cd myapp
          cordova build android --debug

      - name: Verify APK
        run: |
          APK="myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          unzip -l "$APK" | grep 'assets/www/index.html'

          echo "APK successfully generated."

      - name: Upload VEYLQOR APK
        uses: actions/upload-artifact@v4
        with:
          name: VEYLQOR-Android-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
